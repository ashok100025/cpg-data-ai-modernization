# CI for the proof of concept. Every push and pull request must pass before it can be merged.
# Gates: 73 dbt data tests + the enforced fact contract, 65 Python tests incl. the AI golden-question set,
# the incremental October run, and the container build + run.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned dependencies
        run: make setup
      - name: Build history + data tests + forecast + Python tests
        run: make all
      - name: Governed AI demo (answered / restricted / refused)
        run: make ai-demo
      - name: Incremental run with late data, corrections and bad rows
        run: make demo-incremental
      - name: Finance restatement (RESTATE + BOOK_IN_CURRENT) and report
        run: make demo-restatement
      - name: Tests again after the incremental run and the restatement
        run: make test
      - name: Warehouse summary
        run: make inspect
      - name: dbt docs (lineage graph)
        run: make docs-generate
      - name: Upload dbt docs and AI audit log
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs-and-audit
          path: |
            dbt/target/index.html
            dbt/target/manifest.json
            dbt/target/catalog.json
            outputs/audit/insight_audit.jsonl

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t cpg-data-ai-poc .
      - name: Run the whole PoC in the container
        run: docker run --rm cpg-data-ai-poc
      - name: Step-by-step path - dbt docs reachable from the host
        run: |
          docker run -d --name cpg-demo -p 8080:8080 cpg-data-ai-poc sleep infinity
          docker exec cpg-demo make all
          docker exec -d cpg-demo make docs
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8080/index.html && echo "docs reachable on host port 8080" && break; sleep 2; done
          curl -sf -o /dev/null http://localhost:8080/index.html
          docker rm -f cpg-demo
