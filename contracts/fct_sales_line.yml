# Outbound (consumer) contract for the curated sales fact. Enforced at build time by the
# dbt model contract in dbt/models/gold/_gold.yml - a breaking change fails CI.
name: gold.fct_sales_line
version: 1.1.0   # 1.1.0 (additive): accounting_month, restatement_id, is_restated - ADR-004
owner: Data Platform pod (Engineer A)      # see docs/delivery/pod_plan.md
grain: one source sales or return line event
business_key: sales_line_key = md5(source_system | source_txn_id | source_line_no)
measures_defined_in: metrics/metrics.yml     # consumers must not re-derive revenue
semantics:
  qty: signed; returns are negative
  amounts: INR at monthly average FX rate; tax excluded (assumption A-01)
  region_code_at_sale: region at time of sale (as-was); use dim_store.is_current for as-is
  accounting_month: month the line counts in the books - sale month unless Finance booked a restatement later
  restated lines: restatement_id set; never deleted, released from quarantine by Finance approval
  adjustment lines: a late correction booked in a later month is a separate line, key md5(original key | ADJ | restatement_id), qty = difference
freshness: available by 06:00 local after each batch (production target)
quality_guarantees: [unique business key, no orphan dimension keys, reconciles to validated silver]
consumers: [BI / reporting, revenue forecast, AI insight service]
change_policy: semver; breaking changes -> new major version published alongside the old for one release
